<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Crystal Overdrive</title>
    <meta name="description" content="Classic 90s handheld monster RPG web engine tribute featuring authentic GBC tilemaps, turn-based battle mechanics, and responsive controls." />
    <meta property="og:title" content="Crystal Overdrive" />
    <meta property="og:description" content="Classic 90s handheld monster RPG web engine tribute featuring authentic GBC tilemaps, turn-based battle mechanics, and responsive controls." />
    <meta property="og:type" content="website" />
    <!-- Google Stitch Neo-Kanto Protocol Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&family=Space+Mono:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet" />
    <!-- Critical Asset Preloading for Instant Mobile & Low-Latency Overdrive Startup (Ticket 6.5) -->
    <link rel="preload" href="./assets/sprites/characters/gold_walk.png" as="image" />
    <link rel="preload" href="./assets/sprites/characters/kris_walk.png" as="image" />
    <link rel="preload" href="./assets/sprites/pokeballs/poke_ball.png" as="image" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      html, body {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        margin: 0;
        padding: 0;
        background-color: #111418;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        color: #ffffff;
        touch-action: manipulation;
      }
      #app-container {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        overflow: hidden;
        margin: 0;
        padding: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: manipulation;
      }
      #canvas-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 1;
        touch-action: none;
      }
      #ui-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 10;
      }
      #overworld-hud-container,
      #battle-hud-container,
      #modal-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #overworld-hud-container {
        z-index: 10;
      }
      #battle-hud-container {
        z-index: 20;
      }
      #modal-container {
        z-index: 50;
      }
      .interactive {
        pointer-events: auto;
      }
      @media (hover: none) and (pointer: coarse), (max-width: 768px) {
        .keyboard-hint {
          display: none !important;
        }
      }
      body.touch-controls-active .keyboard-hint {
        display: none !important;
      }
      /* Zero-Latency Animated Retro GBC Loader (Ticket Sprint 09) */
      #retro-loader {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        height: 100dvh;
        background: radial-gradient(circle at center, #1e293b 0%, #0f172a 55%, #020617 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        z-index: 9999;
        transition: opacity 0.45s cubic-bezier(0.22, 1, 0.36, 1), visibility 0.45s ease;
      }
      #retro-loader.loaded {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      .loader-pokeball {
        position: relative;
        width: 68px;
        height: 68px;
        border-radius: 50%;
        border: 4px solid #0f172a;
        background: linear-gradient(to bottom, #dc2626 0%, #dc2626 47%, #0f172a 47%, #0f172a 53%, #f8fafc 53%, #f8fafc 100%);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7), 0 0 24px rgba(56, 189, 248, 0.35);
        animation: pokeballWobble 1.2s ease-in-out infinite;
        transform-origin: 50% 80%;
      }
      .loader-pokeball::after {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 20px;
        height: 20px;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        background: #38bdf8;
        border: 4px solid #0f172a;
        box-shadow: 0 0 12px #38bdf8, inset 0 0 4px #ffffff;
      }
      @keyframes pokeballWobble {
        0%, 100% { transform: rotate(0deg) translateY(0); }
        20% { transform: rotate(-16deg) translateY(-3px); }
        40% { transform: rotate(14deg) translateY(-2px); }
        60% { transform: rotate(-8deg) translateY(-1px); }
        80% { transform: rotate(5deg) translateY(0); }
      }
      .loader-title {
        font-family: 'Courier New', Courier, monospace;
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 3px;
        color: #f8fafc;
        text-shadow: 0 2px 10px rgba(56, 189, 248, 0.6), 2px 2px 0 #0f172a;
      }
      .loader-bar-shell {
        width: 260px;
        max-width: 78vw;
        height: 16px;
        padding: 2px;
        border-radius: 999px;
        background: #0f172a;
        border: 2px solid #38bdf8;
        box-shadow: 0 0 16px rgba(56, 189, 248, 0.25), inset 0 1px 4px rgba(0, 0, 0, 0.8);
        overflow: hidden;
      }
      #loader-progress-fill {
        width: 12%;
        height: 100%;
        border-radius: 999px;
        background: repeating-linear-gradient(
          -45deg,
          #38bdf8,
          #38bdf8 10px,
          #0ea5e9 10px,
          #0ea5e9 20px
        );
        background-size: 28px 28px;
        animation: progressStripes 0.7s linear infinite;
        transition: width 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      }
      @keyframes progressStripes {
        0% { background-position: 0 0; }
        100% { background-position: 28px 0; }
      }
      #loader-status-text {
        font-family: 'Courier New', Courier, monospace;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 1px;
        color: #94a3b8;
        min-height: 16px;
      }
    </style>
  </head>
  <body>
    <div id="retro-loader">
      <div class="loader-pokeball" aria-hidden="true"></div>
      <div class="loader-title">CRYSTAL OVERDRIVE</div>
      <div class="loader-bar-shell">
        <div id="loader-progress-fill"></div>
      </div>
      <div id="loader-status-text">Initializing Game Boy Color engine...</div>
    </div>
    <script>
      window.updateLoaderProgress = function (pct, label) {
        var fill = document.getElementById('loader-progress-fill');
        var status = document.getElementById('loader-status-text');
        if (fill && typeof pct === 'number') {
          fill.style.width = Math.max(0, Math.min(100, pct)) + '%';
        }
        if (status && label) {
          status.textContent = label;
        }
      };
      window.dismissLoader = function () {
        var loader = document.getElementById('retro-loader');
        if (!loader) return;
        loader.classList.add('loaded');
        setTimeout(function () {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 460);
      };
    </script>
    <div id="app-container">
      <div id="canvas-container"></div>
      <div id="ui-overlay">
        <div id="overworld-hud-container"></div>
        <div id="battle-hud-container"></div>
        <div id="modal-container"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
